name: Build M2 project image
on:
  push:
    branches: [codex/build-project-image]
    paths: [.github/workflows/project-image.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_REVISION: 413ff340dd2dab415e1779776262ce9a402a71ec
  IMAGE: m2-rallly:413ff340d
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Build the pinned fork with both project features
        run: |
          docker build --build-arg SELF_HOSTED=true \
            --build-arg APP_VERSION="$SOURCE_REVISION" \
            --label "org.opencontainers.image.revision=$SOURCE_REVISION" \
            --label org.opencontainers.image.source=https://github.com/Geoffrey-COUTANT/rallly \
            -t "$IMAGE" -f apps/web/Dockerfile .
      - name: Verify architecture and non-root user
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = nextjs
          docker run --rm --entrypoint node "$IMAGE" -e 'console.log(process.arch)'
      - name: Export the image for the local Docker stack
        run: |
          docker save "$IMAGE" | gzip -1 > rallly-arm64.tar.gz
          sha256sum rallly-arm64.tar.gz > rallly-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rallly-project-arm64
          path: |
            rallly-arm64.tar.gz
            rallly-arm64.tar.gz.sha256
          compression-level: 0
          retention-days: 3
